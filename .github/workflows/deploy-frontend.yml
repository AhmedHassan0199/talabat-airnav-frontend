name: Deploy Market Frontend to Vultr

on:
  push:
    branches:
      - master    # غيّرها لو الفرع مختلف

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (optional)
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy market frontend on Vultr
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
          set -e

          echo ">>> Switching to market frontend directory..."
          cd /apps/airnav-compound-app/market-frontend

          echo ">>> Pulling latest frontend code..."
          git fetch --all
          git reset --hard origin/master

          echo ">>> Building frontend Docker image..."
          cd /apps/airnav-compound-app
          docker compose build market-frontend

          echo ">>> Restarting frontend service..."
          docker compose up -d market-frontend

          echo ">>> Frontend deployment complete ✅"
          EOF
